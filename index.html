<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BotNotas" />
  <title>BotNotas</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <style>
    :root { color-scheme: dark; background: #0b1020; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #0b1020;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity .25s ease;
    }
    .card { text-align: center; }
    .logo {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      font-size: 40px;
      background: linear-gradient(135deg, #7c3aed, #22d3ee);
      box-shadow: 0 18px 55px rgba(34, 211, 238, .18);
    }
    .title { font-size: 24px; font-weight: 800; margin-bottom: 5px; }
    .sub { opacity: .72; font-size: 14px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="card">
      <div class="logo">🧾</div>
      <div class="title">BotNotas</div>
      <div class="sub">Carregando suas compras…</div>
    </div>
  </div>

  <iframe
    id="app"
    src="https://botnotas-i8gvc7aygpwqvhvyyvbqdg.streamlit.app/?embed=true&embed_options=dark_theme"
    title="BotNotas"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    const frame = document.getElementById("app");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", () => {
      setTimeout(() => {
        loading.style.opacity = "0";
        setTimeout(() => loading.remove(), 260);
      }, 350);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
